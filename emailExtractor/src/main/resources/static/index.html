<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Smart Email Campaign System</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#0f172a;
            color:white;
        }

        /* Navbar */

        .navbar{
            width:100%;
            background:#1e293b;
            padding:15px 30px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:15px;
        }

        .navbar h2{
            color:white;
        }

        .nav-actions{
            display:flex;
            gap:10px;
            align-items:center;
            flex-wrap:wrap;
        }

        .navbar input[type="file"]{
            padding:8px;
            background:white;
            border-radius:5px;
            color:black;
        }

        .navbar button{
            padding:10px 18px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:14px;
            font-weight:bold;
            transition:0.3s;
        }

        .navbar button:hover{
            transform:scale(1.03);
            opacity:0.9;
        }

        .upload-btn{
            background:#22c55e;
            color:white;
        }

        .check-btn{
            background:#3b82f6;
            color:white;
        }

        .delete-all-btn{
            background:#dc2626;
            color:white;
        }

        /* Container */

        .container{
            width:90%;
            margin:30px auto;
        }

        /* Top Section */

        .top-section{
            display:flex;
            gap:25px;
            align-items:flex-start;
            margin-bottom:25px;
            flex-wrap:wrap;
        }

        /* Dashboard */

        .dashboard-container{
            flex:1;
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
            gap:20px;
        }

        .dashboard-card{
            background:white;
            color:black;
            padding:25px;
            border-radius:12px;
            text-align:center;
            box-shadow:0 0 15px rgba(0,0,0,0.15);
            transition:0.3s;
        }

        .dashboard-card:hover{
            transform:translateY(-5px);
        }

        .dashboard-card h3{
            margin-bottom:10px;
            color:#334155;
            font-size:18px;
        }

        .dashboard-card p{
            font-size:30px;
            font-weight:bold;
            color:#3b82f6;
        }

        /* Card */

        .card{
            background:white;
            color:black;
            padding:25px;
            border-radius:12px;
            box-shadow:0 0 15px rgba(0,0,0,0.2);
        }

        .email-card{
            flex:1;
            min-width:350px;
        }

        h1{
            margin-bottom:20px;
            text-align:center;
            color:#0f172a;
        }

        /* Form */

        .form-group{
            margin-bottom:15px;
        }

        .form-group label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
        }

        .form-group input,
        .form-group textarea{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;
        }

        .form-group textarea{
            height:180px;
            resize:vertical;
        }

        .send-btn{
            background:#f59e0b;
            color:white;
            width:100%;
            margin-top:15px;
            padding:14px;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
            font-weight:bold;
        }

        .send-btn:hover{
            opacity:0.9;
        }

        /* Table */

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        table th,
        table td{
            border:1px solid #ddd;
            padding:12px;
            text-align:left;
        }

        table th{
            background:#3b82f6;
            color:white;
        }

        table tr:nth-child(even){
            background:#f8fafc;
        }

        .delete-btn{
            background:#ef4444;
            color:white;
            border:none;
            padding:8px 12px;
            border-radius:5px;
            cursor:pointer;
        }

        .delete-btn:hover{
            background:#dc2626;
        }

        /* Message */

        #message{
            margin:20px 0;
            font-weight:bold;
            text-align:center;
            color:#16a34a;
        }

        /* Responsive */

        @media(max-width:1000px){

            .top-section{
                flex-direction:column;
            }

            .dashboard-container{
                width:100%;
            }

            .email-card{
                width:100%;
            }
        }

        @media(max-width:768px){

            .navbar{
                flex-direction:column;
                align-items:flex-start;
            }

            table{
                font-size:12px;
            }

            .container{
                width:95%;
            }
        }

    </style>

</head>

<body>

<!-- Navbar -->

<div class="navbar">

    <h2>Smart Email Campaign</h2>

    <div class="nav-actions">

        <input type="file" id="fileInput" />

        <button class="upload-btn" onclick="uploadFile()">
            Upload File
        </button>

        <button class="check-btn" onclick="loadEmails()">
            Load Emails
        </button>

        <button class="delete-all-btn" onclick="deleteAllEmails()">
            Delete All Emails
        </button>

    </div>

</div>

<!-- Main Container -->

<div class="container">

    <!-- Top Section -->

    <div class="top-section">

        <!-- Dashboard -->

        <div class="dashboard-container">

            <div class="dashboard-card">
                <h3>Total Emails</h3>
                <p id="totalEmails">0</p>
            </div>

            <div class="dashboard-card">
                <h3>Emails Sent</h3>
                <p id="emailsSent">0</p>
            </div>

            <div class="dashboard-card">
                <h3>Failed Emails</h3>
                <p id="failedEmails">0</p>
            </div>

            <div class="dashboard-card">
                <h3>Uploaded Files</h3>
                <p id="uploadedFiles">0</p>
            </div>

            <div class="dashboard-card">
                <h3>Success Rate</h3>
                <p id="successRate">0%</p>
            </div>

        </div>

        <!-- Send Email Card -->

        <div class="card email-card">

            <h1>Send Email To All</h1>

            <div id="message"></div>

            <div class="form-group">

                <label>Subject</label>

                <input
                        type="text"
                        id="subject"
                        placeholder="Enter email subject"
                />

            </div>

            <div class="form-group">

                <label>Message</label>

                <textarea
                        id="emailMessage"
                        placeholder="Write your email message..."
                ></textarea>

            </div>

            <button class="send-btn" onclick="sendAllEmails()">
                Send To All Emails
            </button>

        </div>

    </div>

    <!-- Email Table -->

    <div class="card">

        <h1>Extracted Emails</h1>

        <table>

            <thead>

            <tr>
                <th>SL</th>
                <th>Email</th>
                <th>Source File</th>
                <th>Action</th>
            </tr>

            </thead>

            <tbody id="emailTable">

            </tbody>

        </table>

    </div>

</div>

<!-- JavaScript -->

<script>

    const API_BASE = "/api";

    // Show Message

    function showMessage(text, color = "#16a34a") {

        const messageBox =
            document.getElementById("message");

        messageBox.style.color = color;

        messageBox.innerText = text;
    }

    // Dashboard

    async function loadDashboard() {

        try {

            const response =
                await fetch(`${API_BASE}/dashboard`);

            const data = await response.json();

            document.getElementById("totalEmails").innerText =
                data.totalEmails;

            document.getElementById("emailsSent").innerText =
                data.emailsSent;

            document.getElementById("failedEmails").innerText =
                data.failedEmails;

            document.getElementById("uploadedFiles").innerText =
                data.uploadedFiles;

            document.getElementById("successRate").innerText =
                data.successRate.toFixed(2) + "%";

        } catch(error){

            console.error(error);
        }
    }

    // Upload File

    async function uploadFile() {

        try {

            const fileInput =
                document.getElementById("fileInput");

            const file = fileInput.files[0];

            if (!file) {

                alert("Please select a file");

                return;
            }

            const formData = new FormData();

            formData.append("file", file);

            showMessage("Uploading file...", "#2563eb");

            const response =
                await fetch(`${API_BASE}/upload`, {

                    method: "POST",
                    body: formData

                });

            const result = await response.text();

            showMessage(result);

            fileInput.value = "";

            loadEmails();
            loadDashboard();

        } catch (error) {

            console.error(error);

            showMessage("File upload failed!", "#dc2626");
        }
    }

    // Load Emails

    async function loadEmails() {

        try {

            const response =
                await fetch(`${API_BASE}/emails`);

            const data = await response.json();

            const table =
                document.getElementById("emailTable");

            table.innerHTML = "";

            if (data.length === 0) {

                table.innerHTML = `
                    <tr>
                        <td colspan="4" style="text-align:center;">
                            No emails found
                        </td>
                    </tr>
                `;

                return;
            }

            data.forEach((email, index) => {

                table.innerHTML += `

                    <tr>

                        <td>${index + 1}</td>

                        <td>${email.email}</td>

                        <td>${email.sourceFile || "N/A"}</td>

                        <td>

                            <button
                                class="delete-btn"
                                onclick="deleteEmail(${email.id})"
                            >
                                Delete
                            </button>

                        </td>

                    </tr>

                `;
            });

        } catch (error) {

            console.error(error);

            showMessage("Failed to load emails!", "#dc2626");
        }
    }

    // Delete Single Email

    async function deleteEmail(id) {

        try {

            const response =
                await fetch(`${API_BASE}/emails/${id}`, {

                    method: "DELETE"

                });

            const result = await response.text();

            showMessage(result);

            loadEmails();
            loadDashboard();

        } catch (error) {

            console.error(error);

            showMessage("Delete failed!", "#dc2626");
        }
    }

    // Delete All Emails

    async function deleteAllEmails() {

        try {

            const confirmDelete =
                confirm("Are you sure you want to delete all emails?");

            if (!confirmDelete) {
                return;
            }

            const response =
                await fetch(`${API_BASE}/emails/delete-all`, {

                    method: "DELETE"

                });

            const result = await response.text();

            showMessage(result);

            loadEmails();
            loadDashboard();

        } catch (error) {

            console.error(error);

            showMessage("Delete all failed!", "#dc2626");
        }
    }

    // Send All Emails

    async function sendAllEmails() {

        try {

            const subject =
                document.getElementById("subject").value.trim();

            const message =
                document.getElementById("emailMessage").value.trim();

            if (subject === "" || message === "") {

                alert("Please enter subject and message");

                return;
            }

            showMessage("Sending emails...", "#2563eb");

            const response =
                await fetch(`${API_BASE}/send-all`, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        subject: subject,
                        message: message

                    })

                });

            const result = await response.text();

            showMessage(result);

            loadDashboard();

        } catch (error) {

            console.error(error);

            showMessage("Failed to send emails!", "#dc2626");
        }
    }

    // Auto Load

    loadEmails();
    loadDashboard();

</script>

</body>

</html>
