<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Extractor</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f4f4;
        }

        .navbar{
            width:100%;
            background:#007bff;
            padding:15px 30px;
            display:flex;
            justify-content:flex-end;
            gap:15px;
            align-items:center;
        }

        .navbar input{
            padding:8px;
            background:white;
            border:none;
            border-radius:5px;
        }

        .navbar button{
            padding:10px 18px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:14px;
            font-weight:bold;
        }

        .upload-btn{
            background:#28a745;
            color:white;
        }

        .check-btn{
            background:#ffc107;
            color:black;
        }

        .container{
            width:90%;
            margin:40px auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        h1{
            margin-bottom:20px;
            text-align:center;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        table th,
        table td{
            border:1px solid #ddd;
            padding:12px;
            text-align:left;
        }

        table th{
            background:#007bff;
            color:white;
        }

        #message{
            margin:20px 0;
            font-weight:bold;
            text-align:center;
            color:green;
        }

    </style>

</head>
<body>

<div class="navbar">

    <input type="file" id="fileInput">

    <button class="upload-btn" onclick="uploadFile()">
        Upload File
    </button>

    <button class="check-btn" onclick="loadEmails()">
        Check All Emails
    </button>

</div>

<div class="container">

    <h1>Email Extractor System</h1>

    <div id="message"></div>

    <table>

        <thead>

        <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Source File</th>
        </tr>

        </thead>

        <tbody id="emailTable">

        </tbody>

    </table>

</div>

<script>

    async function uploadFile(){

        const fileInput = document.getElementById("fileInput");

        const file = fileInput.files[0];

        if(!file){

            alert("Please select a file");
            return;
        }

        const formData = new FormData();

        formData.append("file", file);

        const response = await fetch("/api/upload", {

            method:"POST",
            body:formData

        });

        const result = await response.text();

        document.getElementById("message").innerText = result;

        loadEmails();
    }

    async function loadEmails(){

        const response = await fetch("/api/emails");

        const data = await response.json();

        const table = document.getElementById("emailTable");

        table.innerHTML = "";

        data.forEach(email => {

            table.innerHTML += `

                <tr>
                    <td>${email.id}</td>
                    <td>${email.email}</td>
                    <td>${email.sourceFile}</td>
                </tr>

            `;
        });
    }

</script>

</body>
</html>
